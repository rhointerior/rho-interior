<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap">
<style>
@font-face {
  font-family: 'IMFell-GlyphOnly';
  src: url('https://fonts.gstatic.com/s/imfellenglish/v17/Ktk1ALQO_Ycnfp_p80GI6eDl7TKTCMbPHY.woff2') format('woff2');
  font-style: italic; font-weight: 400;
  unicode-range: U+03C1;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --g: clamp(80px, 11vw, 140px);
  --bg:     #1A0E08;
  --ink:    #F0E0CC;
  --brass:  #C87848;
  --gilt:   #C87848;
  --ink-20: rgba(240,224,204,.2);
  --ink-08: rgba(240,224,204,.08);
}

html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Montserrat', sans-serif; overflow: hidden; }

/* ── CANVAS ── */
#canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ── BORDER INSET ── */
.border-inset { position: fixed; inset: 28px; border: .5px solid var(--ink-20); pointer-events: none; z-index: 2; opacity: 0; }
.border-inset::before, .border-inset::after { content: ''; position: absolute; width: 12px; height: 12px; }
.border-inset::before { top: -1px; left: -1px; border-top: 1px solid var(--brass); border-left: 1px solid var(--brass); }
.border-inset::after  { bottom: -1px; right: -1px; border-bottom: 1px solid var(--brass); border-right: 1px solid var(--brass); }

/* ── WORDMARK ── */
.wordmark {
  position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
  text-align: center; z-index: 3; opacity: 0;
}
.wordmark img { width: clamp(120px, 12vw, 160px); height: auto; display: block; margin: 0 auto; }
.wordmark span {
  display: block; margin-top: -6px; padding-left: .6em;
  font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 10px;
  letter-spacing: .6em; text-transform: uppercase; color: var(--ink); opacity: .7;
}

/* ── BOUNCING GLYPH ── */
#glyph-bounce {
  position: fixed; z-index: 4;
  user-select: none; pointer-events: none;
  opacity: 0; will-change: transform;
  filter: drop-shadow(0 2px 40px rgba(200,120,72,.25));
}
#glyph-bounce img {
  height: var(--g);
  width: auto;
  display: block;
}

/* ── TEXT BLOCK — sits below the settled glyph ── */
#text-block {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 3; pointer-events: none;
}
#glyph-slot { height: var(--g); width: 1px; margin-bottom: 36px; }

.rule-wrap { width: clamp(140px, 22vw, 260px); height: 1px; overflow: hidden; opacity: 0; }
.rule-line  { height: 1px; background: linear-gradient(90deg, transparent, var(--gilt), transparent); transform: translateX(-100%); }

.tagline {
  font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400;
  font-size: clamp(20px, 2.8vw, 30px); letter-spacing: .1em; text-align: center;
  color: var(--ink); opacity: 0; margin-top: 24px;
  
}

.coming-soon {
  font-size: 13px; font-weight: 400; letter-spacing: .6em; text-transform: uppercase;
  color: var(--gilt); opacity: 0; margin-top: 28px;
  text-shadow: 0 0 30px rgba(200,120,72,.35);
}

/* ── CONTACT LINK ── */
.contact-link {
  font-size: 9px; font-weight: 300; letter-spacing: .5em; text-transform: uppercase;
  color: var(--brass); opacity: 0; margin-top: 36px;
  cursor: pointer; pointer-events: all;
  border-bottom: .5px solid var(--brass); padding-bottom: 3px;
  transition: color .3s ease, border-color .3s ease;
}
.contact-link:hover { color: var(--ink); border-color: var(--ink); }

/* ── BOTTOM DOMAIN ── */
#foot { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 3; }
.domain { color: var(--ink); text-decoration: none; transition: color .3s ease; font-size: 10px; font-weight: 300; letter-spacing: .4em; text-transform: lowercase; white-space: nowrap; opacity: 0; padding-left: .4em; }

.domain:hover { color: var(--brass); }

/* ── FOLIOS ── */
.folio-bl { font-size: 7px; font-weight: 300; letter-spacing: .3em; opacity: 0; padding-left: .3em; }

/* ── CONTACT OVERLAY ── */
#contact-overlay {
  position: fixed; inset: 0; z-index: 10;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease;
}
#contact-overlay.open { opacity: 1; pointer-events: all; }

.contact-panel {
  width: min(480px, calc(100% - 80px));
  display: flex; flex-direction: column; align-items: center; gap: 0;
}

.contact-close {
  position: fixed; top: 44px; right: 52px;
  font-size: 8px; font-weight: 300; letter-spacing: .4em; text-transform: uppercase;
  color: var(--ink); cursor: pointer; opacity: .5;
  transition: opacity .3s ease;
}
.contact-close:hover { opacity: 1; }

.contact-heading {
  font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
  font-size: clamp(24px, 3.2vw, 36px); letter-spacing: .04em; text-align: center;
  margin-bottom: 8px;
}
.contact-sub {
  font-size: 8px; font-weight: 300; letter-spacing: .4em; text-transform: uppercase;
  color: var(--brass); margin-bottom: 40px;
}

.contact-form { width: 100%; display: flex; flex-direction: column; gap: 20px; }

.form-field { display: flex; flex-direction: column; gap: 8px; }
.form-label { font-size: 7px; font-weight: 300; letter-spacing: .4em; text-transform: uppercase; color: var(--brass); }
.form-input, .form-textarea {
  background: transparent; border: none; border-bottom: .5px solid var(--ink-20);
  color: var(--ink); font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 16px; font-weight: 300; padding: 8px 0;
  outline: none; width: 100%;
  transition: border-color .3s ease;
}
.form-input:focus, .form-textarea:focus { border-color: var(--brass); }
.form-input::placeholder, .form-textarea::placeholder { color: var(--ink-20); font-style: italic; }
.form-textarea { resize: none; height: 80px; line-height: 1.6; }

.form-rule { height: .5px; background: linear-gradient(90deg, transparent, var(--brass), transparent); margin: 4px 0; }

.form-submit {
  align-self: center; margin-top: 12px;
  font-family: 'Montserrat', sans-serif;
  font-size: 8px; font-weight: 300; letter-spacing: .5em; text-transform: uppercase;
  color: var(--ink); background: transparent; border: .5px solid var(--ink-20);
  padding: 14px 40px; cursor: pointer;
  transition: border-color .3s ease, color .3s ease;
}
.form-submit:hover { border-color: var(--brass); color: var(--brass); }

.form-sent {
  display: none; text-align: center;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 18px; color: var(--ink); opacity: .8;
  margin-top: 16px;
}

/* ── KEYFRAMES ── */
@keyframes rulePulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes gentleFloat {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  50%     { transform: translateY(-4px) rotate(.6deg); }
}
}

/* ── MOBILE ── */
@media (max-width: 480px) {
  .border-inset { inset: 16px; }
  .wordmark { top: 22px; } .wordmark img { width: 110px; }
  #foot { bottom: 26px; }
  .contact-close { top: 28px; right: 24px; }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="border-inset" id="border"></div>
<div class="wordmark" id="wordmark"><img src="rho-logo-name.svg" alt="rho interior"><span>interior</span></div>

<div id="glyph-bounce"><img src="rho-logomark.svg" alt="rho" /></div>

<div id="text-block">
  <div id="glyph-slot"></div>
  <div class="rule-wrap" id="rule-wrap"><div class="rule-line" id="rule-line"></div></div>
  <div class="tagline" id="tagline">the measure of a room</div>
  <div class="coming-soon" id="coming">coming soon</div>
  <div class="contact-link" id="contact-btn">start here</div>
</div>

<div class="foot" id="foot"><a class="domain" id="domain" href="mailto:design@rhointerior.com">design@rhointerior.com</a><div class="folio-bl" id="fl">Lagos · Nigeria</div></div>

<!-- Contact overlay -->
<div id="contact-overlay">
  <div class="contact-close" id="contact-close">close</div>
  <div class="contact-panel">
    <div class="contact-heading">sign up to be the first to know</div>
    <div class="contact-sub" style="text-transform:none;letter-spacing:.3em;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;">rho interior · Lagos</div>
    <form class="contact-form" id="contact-form" name="notify">
      <input type="hidden" name="bot-field" style="display:none">
      <div class="form-field">
        <label class="form-label">name</label>
        <input class="form-input" type="text" name="name" placeholder="your name" required>
      </div>
      <div class="form-field">
        <label class="form-label">email</label>
        <input class="form-input" type="email" name="email" placeholder="your email address" required>
      </div>
      <div class="form-rule"></div>
      <button class="form-submit" type="submit">notify me</button>
    </form>
    <div class="form-sent" id="form-sent">
      you're on the list — we'll be in touch.
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════
   CANVAS — grid + particles
═══════════════════════════ */
(function() {
  const cv = document.getElementById('canvas'), ctx = cv.getContext('2d');
  let W, H, lines = [], particles = [];
  const INK = 'rgba(240,224,204,', BRASS = 'rgba(200,120,72,';
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  function initLines() {
    lines = [];
    for (let i=0;i<8;i++) lines.push({type:'h',base:H*(i+1)/9,speed:.08+Math.random()*.06,opacity:.04+Math.random()*.05,phase:Math.random()*Math.PI*2});
    for (let i=0;i<6;i++) lines.push({type:'v',base:W*(i+1)/7,speed:.05+Math.random()*.04,opacity:.03+Math.random()*.04,phase:Math.random()*Math.PI*2});
  }
  function initParticles() {
    particles = [];
    for (let i=0;i<44;i++) particles.push({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.4,vx:(Math.random()-.5)*.2,vy:-.1-Math.random()*.22,opacity:.06+Math.random()*.13,brass:Math.random()>.65});
  }
  let t=0;
  function draw() {
    ctx.clearRect(0,0,W,H); t+=.004;
    lines.forEach(l=>{const w=Math.sin(t*l.speed*10+l.phase)*20;ctx.beginPath();ctx.strokeStyle=INK+l.opacity+')';ctx.lineWidth=.5;l.type==='h'?(ctx.moveTo(0,l.base+w),ctx.lineTo(W,l.base+w)):(ctx.moveTo(l.base+w,0),ctx.lineTo(l.base+w,H));ctx.stroke();});
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}if(p.x<-4)p.x=W+4;if(p.x>W+4)p.x=-4;ctx.beginPath();ctx.fillStyle=(p.brass?BRASS:INK)+p.opacity+')';ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();initLines();initParticles();});
  resize();initLines();initParticles();draw();
})();

/* ═══════════════════════════
   GLYPH — swirl → bounce → settle
═══════════════════════════ */
(function() {
  const glyph   = document.getElementById('glyph-bounce');
  const border  = document.getElementById('border');
  const wmark   = document.getElementById('wordmark');
  const domain  = document.getElementById('domain');
  const fl      = document.getElementById('fl');
  const fr      = null;
  const ruleW   = document.getElementById('rule-wrap');
  const ruleL   = document.getElementById('rule-line');
  const tagline = document.getElementById('tagline');
  const coming  = document.getElementById('coming');
  const cBtn    = document.getElementById('contact-btn');
  const tb      = document.getElementById('text-block');

  let W = innerWidth, H = innerHeight;
  window.addEventListener('resize', () => { W = innerWidth; H = innerHeight; });

  let glyphW = 0, glyphH = 0;
  function getGlyphSize() { glyphW = glyph.offsetWidth||220; glyphH = glyph.offsetHeight||220; }

  function easeOut(t) { return 1 - Math.pow(1-t,3); }

  // ── Where glyph settles: upper-center, text block below ──
  // Settled glyph top = (H/2) - glyphH * 0.7  (slightly above center)
  const slot = document.getElementById('glyph-slot');
  function settledX() { return W/2 - glyphW/2; }
  function settledY() { const r = slot.getBoundingClientRect(); return r.top + r.height/2 - glyphH/2; }

  function positionTextBlock() { getGlyphSize(); }

  // ── ARRIVAL: a tiny point of light opens into the full mark ──
  const SWIRL_DURATION = 4200;
  let startTime = null, revealed = false;

  function swirlFrame(ts) {
    if (!startTime) startTime = ts;
    getGlyphSize();
    const raw  = Math.min((ts - startTime) / SWIRL_DURATION, 1);
    const ease = raw * raw * raw * (raw * (raw * 6 - 15) + 10);
    const scale = .015 + ease * .985;
    const rot   = (1 - ease) * -540;
    const blur  = (1 - ease) * 14;
    const glow  = 20 + (1 - ease) * 60;

    const R = Math.min(W, H) * .035 * Math.pow(1 - ease, 2);
    const ang = (1 - ease) * Math.PI * 4;
    glyph.style.left = (settledX() + R * Math.cos(ang)) + 'px';
    glyph.style.top  = (settledY() + R * Math.sin(ang)) + 'px';
    glyph.style.transform = `rotate(${rot}deg) scale(${scale})`;
    glyph.style.opacity = Math.min(raw * 5, 1);
    glyph.style.filter = `blur(${blur}px) brightness(${1 + (1 - ease) * 1.6}) drop-shadow(0 2px ${glow}px rgba(200,120,72,.35))`;

    if (!revealed && raw > .18) { revealed = true; revealUI(); }
    if (raw < 1) {
      requestAnimationFrame(swirlFrame);
    } else {
      glyph.style.filter = '';
      glyph.style.transform = 'none';
      settledDone = true;
      startFloat();
    }
  }

  function revealUI() {
    positionTextBlock();

    border.style.transition = 'opacity 1.2s ease';
    border.style.opacity = '.3';

    wmark.style.transition = 'opacity 2.2s ease, transform 3.4s cubic-bezier(.22,1,.36,1)';
    wmark.style.transform  = 'translateX(-50%) translateY(-90px)';
    setTimeout(() => { wmark.style.transform = 'translateX(-50%) translateY(0)'; wmark.style.opacity = '1'; }, 50);

    domain.style.transition = 'opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1)';
    domain.style.transform  = 'translateY(10px)';
    setTimeout(() => { domain.style.transform = 'translateY(0)'; domain.style.opacity = '.7'; }, 100);

    setTimeout(() => { fl.style.transition = 'opacity .8s ease'; fl.style.opacity = '.5'; }, 200);

    setTimeout(() => {
      ruleW.style.transition = 'opacity .3s ease'; ruleW.style.opacity = '1';
      ruleL.style.transition = 'transform 1.2s cubic-bezier(.22,1,.36,1)'; ruleL.style.transform = 'translateX(0)';
      setTimeout(() => { ruleW.style.animation = 'rulePulse 3.4s ease-in-out infinite'; }, 1300);
    }, 300);

    setTimeout(() => {
      tagline.style.transition = 'opacity .8s ease, transform .8s ease';
      tagline.style.transform = 'translateY(6px)';
      setTimeout(() => { tagline.style.transform = 'translateY(0)'; tagline.style.opacity = '1'; }, 50);
    }, 600);

    setTimeout(() => {
      coming.style.transition = 'opacity .8s ease, transform .8s ease';
      coming.style.transform = 'translateY(6px)';
      setTimeout(() => { coming.style.transform = 'translateY(0)'; coming.style.opacity = '1'; }, 50);
    }, 900);

    setTimeout(() => {
      cBtn.style.transition = 'opacity .8s ease';
      cBtn.style.opacity = '.85';
    }, 1200);
  }

  let settledDone = false;

  function startFloat() {
    glyph.style.animation = 'gentleFloat 7s ease-in-out infinite';
  }

  // ── BOOT ──
  function boot() {
    getGlyphSize();
    positionTextBlock();
    glyph.style.opacity = '0';
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { getGlyphSize(); positionTextBlock(); requestAnimationFrame(swirlFrame); });
    } else {
      setTimeout(() => requestAnimationFrame(swirlFrame), 400);
    }
  }

  setTimeout(boot, 100);

  // Reposition on resize
  window.addEventListener('resize', () => { getGlyphSize(); if (settledDone) { glyph.style.left = settledX()+'px'; glyph.style.top = settledY()+'px'; } });
})();

/* ═══════════════════════════
   CONTACT OVERLAY
═══════════════════════════ */
(function() {
  const overlay = document.getElementById('contact-overlay');
  const openBtn = document.getElementById('contact-btn');
  const closeBtn= document.getElementById('contact-close');
  const form    = document.getElementById('contact-form');
  const sent    = document.getElementById('form-sent');

  openBtn.addEventListener('click', () => overlay.classList.add('open'));
  closeBtn.addEventListener('click', () => overlay.classList.remove('open'));

  // Close on backdrop click (outside panel)
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

      form.addEventListener('submit', e => {
    e.preventDefault();
    const nameVal  = form.querySelector('[name="name"]').value;
    const emailVal = form.querySelector('[name="email"]').value;

    fetch('/.netlify/functions/subscribe', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'name=' + encodeURIComponent(nameVal) + '&email=' + encodeURIComponent(emailVal)
    }).finally(() => {
      form.style.display = 'none';
      sent.style.display = 'block';
      setTimeout(() => {
        overlay.classList.remove('open');
        setTimeout(() => { form.style.display = ''; sent.style.display = 'none'; form.reset(); }, 600);
      }, 3000);
    });
  });
})();
</script>
</body>
</html>
